name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Publish Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build

      - name: Run Test Suites
        run: pnpm test

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --filter "@nextlevelbuilder/contracts" publish --access public --no-git-checks
          pnpm --filter "@nextlevelbuilder/cli" publish --access public --no-git-checks
          pnpm --filter "@nextlevelbuilder/mcp" publish --access public --no-git-checks
